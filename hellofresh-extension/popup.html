<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HelloFresh Meal Ratings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f9fafb;
      color: #111827;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e7eb;
    }
    .header img {
      width: 24px;
      height: 24px;
      border-radius: 5px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #067a46;
    }
    .status-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .stat-label {
      color: #6b7280;
    }
    .stat-value {
      font-weight: 600;
      color: #111827;
    }
    .filters-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .filters-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #4b5563;
      margin-bottom: 8px;
    }
    .filter-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      cursor: pointer;
      user-select: none;
      font-size: 12.5px;
      font-weight: 500;
      color: #1f2937;
    }
    .filter-option + .filter-option {
      border-top: 1px solid #f3f4f6;
    }
    .filter-option input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #067a46;
      cursor: pointer;
    }
    .scale-preview {
      margin-bottom: 12px;
    }
    .scale-title {
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .scale-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
    }
    .scale-chip {
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
    }
    .c1 { background: #b71c1c; }
    .c2 { background: #d32f2f; }
    .c3 { background: #e64a19; }
    .c4 { background: #f4511e; }
    .c5 { background: #ff8f00; color: #111827; }
    .c6 { background: #ffb300; color: #111827; }
    .c7 { background: #fdd835; color: #111827; }
    .c8 { background: #7cb342; }
    .c9 { background: #2e9e44; }
    .c10 { background: #087f23; }

    .actions {
      display: flex;
      gap: 8px;
    }
    button, a.btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    #syncBtn {
      background: #067a46;
      color: #ffffff;
    }
    #syncBtn:hover {
      background: #056037;
    }
    #syncBtn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    a.btn-secondary {
      background: #ffffff;
      color: #374151;
      border-color: #d1d5db;
    }
    a.btn-secondary:hover {
      background: #f3f4f6;
    }
    .note {
      margin-top: 8px;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="HF">
    <h1>HelloFresh Meal Ratings</h1>
  </div>

  <div class="status-card">
    <div class="stat-row">
      <span class="stat-label">Rated Meals Loaded:</span>
      <span class="stat-value" id="mealCount">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Sync Source:</span>
      <span class="stat-value" id="syncSource">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Last Updated:</span>
      <span class="stat-value" id="lastSync">—</span>
    </div>
  </div>

  <div class="filters-card">
    <div class="filters-title">Auto-Hide Filters (Saved)</div>
    <label class="filter-option" for="hideBelow7">
      <span>Hide meals rated below 7</span>
      <input type="checkbox" id="hideBelow7">
    </label>
    <label class="filter-option" for="hidePremium">
      <span>Hide Premium / Surcharge picks</span>
      <input type="checkbox" id="hidePremium">
    </label>
  </div>

  <div class="scale-preview">
    <div class="scale-title">1–10 Color Scale (rounds down for half-scores)</div>
    <div class="scale-grid">
      <div class="scale-chip c1">1</div>
      <div class="scale-chip c2">2</div>
      <div class="scale-chip c3">3</div>
      <div class="scale-chip c4">4</div>
      <div class="scale-chip c5">5</div>
      <div class="scale-chip c6">6</div>
      <div class="scale-chip c7">7</div>
      <div class="scale-chip c8">8</div>
      <div class="scale-chip c9">9</div>
      <div class="scale-chip c10">10</div>
    </div>
  </div>

  <div class="actions">
    <button id="syncBtn">Sync Sheet Now</button>
    <a class="btn btn-secondary" href="https://docs.google.com/spreadsheets/d/1mQOm4Cge3Oz5DVFKsj7uGXiLjC9RIq1f8_RaLatYB8E/edit#gid=0" target="_blank" rel="noopener">Open Sheet</a>
  </div>
  <div class="note" id="statusNote">Active on hellofresh.com/store meal selection pages.</div>

  <script src="popup.js"></script>
</body>
</html>
